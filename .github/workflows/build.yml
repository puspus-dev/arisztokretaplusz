name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install missing local-notifications package
        run: npm install @ionic-native/local-notifications@5.28.0 --save --legacy-peer-deps

      - name: Install Ionic & Cordova CLI
        run: npm install -g @ionic/cli cordova@10

      - name: Prepare Cordova Android platform
        run: |
          ionic cordova platform remove android || true
          ionic cordova platform add android@8.1.0 --confirm

          # 1) JDK ellenőrzés kikapcsolása (Cordova 8.1 csak 1.8-at engedne)
          if [ -f platforms/android/cordova/lib/check_reqs.js ]; then
            sed -i 's/version\.match(\/\^1\\\.8\\\.\/)/version.match(\/^1\\.[0-9].*/' platforms/android/cordova/lib/check_reqs.js || true
            sed -i "s/Requirements check failed for JDK 8.*/console.log('JDK check bypassed');/" platforms/android/cordova/lib/check_reqs.js || true
          fi

          # 2) Gradle wrapper átírása Java 17-kompatibilis verzióra
          if [ -f platforms/android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-all.zip|' platforms/android/gradle/wrapper/gradle-wrapper.properties
            cat platforms/android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build web assets
        run: npx ng build --configuration=production

      - name: Build Android Release APK
        run: |
          java -version
          # Ne a rendszer gradle-jét használja
          export PATH="/usr/local/lib/android/sdk/platform-tools:$PATH"
          # Cordova a platforms/android/gradlew-t fogja hívni
          ionic cordova build android --release --prod -- --gradleArg=--no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Decode and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nincs keystore secret, aláírás kihagyva."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

          UNSIGNED_APK=$(find platforms/android -name "*-release-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Nem található unsigned APK:"
            find platforms/android -name "*.apk" || true
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$UNSIGNED_APK" \
            "$KEY_ALIAS"

          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name zipalign | sort | tail -n 1)
          "$ZIPALIGN" -v 4 "$UNSIGNED_APK" app-release-signed.apk

          echo "Aláírt APK kész:"
          ls -la app-release-signed.apk

      - name: Upload web build (www)
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www/
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app-release-signed.apk
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
