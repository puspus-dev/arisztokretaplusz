name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install missing local-notifications package
        run: npm install @ionic-native/local-notifications@5.28.0 --save --legacy-peer-deps

      - name: Install Ionic & Cordova CLI
        run: npm install -g @ionic/cli cordova@10

      - name: Prepare Cordova Android platform
        run: |
          ionic cordova platform remove android || true
          ionic cordova platform add android@8.1.0 --confirm

      - name: Build web assets
        run: npx ng build --configuration=production

      - name: Build Android Release APK (unsigned)
        run: ionic cordova build android --release --prod

      # ---------- Aláírás (csak ha be vannak állítva a secret-ek) ----------
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Sign the APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          # Megkeressük az unsigned APK-t
          UNSIGNED_APK=$(find platforms/android -name "*-release-unsigned.apk" | head -n 1)
          echo "Unsigned APK: $UNSIGNED_APK"

          # Aláírás
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            "$UNSIGNED_APK" \
            "${{ secrets.KEY_ALIAS }}"

          # zipalign
          ALIGNED_APK="app-release-signed.apk"
          zipalign -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          echo "Signed APK prepared: $ALIGNED_APK"
          ls -la "$ALIGNED_APK"

      - name: Upload web build (www)
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www/
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app-release-signed.apk
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
