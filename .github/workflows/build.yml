name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install missing local-notifications package
        run: npm install @ionic-native/local-notifications@5.28.0 --save --legacy-peer-deps

      - name: Install Ionic & Cordova CLI
        run: npm install -g @ionic/cli cordova@10

      - name: Prepare Cordova Android platform
        run: |
          ionic cordova platform remove android || true
          ionic cordova platform add android@8.1.0 --confirm

          # Minden check_reqs.js-t megkeresünk és bypassoljuk a JDK 8 ellenőrzést
          python3 << 'EOF'
          import re, pathlib
          for path in pathlib.Path(".").rglob("check_reqs.js"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text
              # 1) if (!version.match(...)) → if (false)
              text = re.sub(
                  r"if\s*\(\s*!version\.match\([^)]*\)\s*\)",
                  "if (false)",
                  text
              )
              # 2) Ha mégis van JDK 8 reject szöveg, semlegesítjük
              text = text.replace(
                  "Requirements check failed for JDK 8",
                  "JDK check bypassed"
              )
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched: {path}")
          EOF

          # Gradle 7.6.3 (Java 17 kompatibilis)
          WRAPPER="platforms/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-all.zip|' "$WRAPPER"
            cat "$WRAPPER"
          fi

          echo "=== Java version ==="
          java -version

      - name: Build web assets
        run: npx ng build --configuration=production

      - name: Build Android Release APK
        run: ionic cordova build android --release --prod
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Decode and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nincs keystore secret, aláírás kihagyva."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

          UNSIGNED_APK=$(find platforms/android -name "*-release-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Nem található unsigned APK:"
            find platforms/android -name "*.apk" || true
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$UNSIGNED_APK" \
            "$KEY_ALIAS"

          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name zipalign | sort | tail -n 1)
          "$ZIPALIGN" -v 4 "$UNSIGNED_APK" app-release-signed.apk

          echo "Aláírt APK kész:"
          ls -la app-release-signed.apk

      - name: Upload web build (www)
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www/
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app-release-signed.apk
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
